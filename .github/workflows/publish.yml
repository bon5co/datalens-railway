name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [db, temporal, control-api, data-api, us, ui-api, meta-manager, auth, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: datalens-${{ matrix.role }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.role }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/bon5co/datalens-railway-${{ matrix.role }}:2.9.0
            ghcr.io/bon5co/datalens-railway-${{ matrix.role }}:latest
